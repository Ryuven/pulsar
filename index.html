<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовая связь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info span {
            font-weight: bold;
            color: #333;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            margin-right: 5px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-call {
            background: #22c55e;
            color: white;
            padding: 8px 15px;
        }
        .btn-call:hover {
            background: #16a34a;
        }
        .btn-call.active {
            background: #ef4444;
        }
        .btn-call.active:hover {
            background: #dc2626;
        }
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .user-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }
        .user-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .user-card .username {
            font-weight: bold;
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        .user-card .status {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        .user-card .status.online {
            color: #22c55e;
        }
        .user-card .status.offline {
            color: #94a3b8;
        }
        .call-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .mic-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #94a3b8;
            transition: all 0.3s;
        }
        .mic-indicator.active {
            background: #22c55e;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .call-status {
            margin-top: 10px;
            padding: 8px;
            background: #f1f5f9;
            border-radius: 5px;
            font-size: 14px;
            color: #475569;
            text-align: center;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .microphone-permission {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            color: #92400e;
        }
        .microphone-permission button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .microphone-permission button:hover {
            background: #d97706;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <span>👤 <span id="currentUser">Загрузка...</span></span>
                <span><span class="status-dot"></span> Онлайн</span>
            </div>
            <button class="btn btn-danger" onclick="logout()">Выйти</button>
        </div>

        <div id="micPermission" class="microphone-permission" style="display:none;">
            <strong>⚠️ Требуется доступ к микрофону</strong>
            <p>Для голосовой связи необходимо разрешить использование микрофона.</p>
            <button onclick="requestMicrophone()">Разрешить микрофон</button>
        </div>

        <div id="usersContainer">
            <h3 style="margin-bottom: 20px;">👥 Пользователи онлайн</h3>
            <div id="usersList" class="users-grid"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { getDatabase, ref, onValue, set, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCtMunMRiOWKSGh939BEU2TvhEgv_wB60",
            authDomain: "pulsar-galelium.firebaseapp.com",
            databaseURL: "https://pulsar-galelium-default-rtdb.firebaseio.com",
            projectId: "pulsar-galelium",
            storageBucket: "pulsar-galelium.firebasestorage.app",
            messagingSenderId: "407132877855",
            appId: "1:407132877855:web:fd29af874d74dcda90912a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        let currentUser = sessionStorage.getItem('currentUser');
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        document.getElementById('currentUser').textContent = currentUser;

        // Проверка разрешения микрофона
        let micPermission = false;
        let localStream = null;
        let peerConnections = {};
        let audioContext = null;
        let gainNode = null;

        // Проверяем разрешение микрофона
        navigator.permissions.query({ name: 'microphone' }).then(result => {
            if (result.state === 'denied') {
                document.getElementById('micPermission').style.display = 'block';
            } else if (result.state === 'granted') {
                initMicrophone();
            }
        });

        window.requestMicrophone = function() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    document.getElementById('micPermission').style.display = 'none';
                    micPermission = true;
                    localStream = stream;
                    
                    // Создаем аудио контекст для обработки
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    gainNode = audioContext.createGain();
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(gainNode);
                    
                    updateAllCalls();
                })
                .catch(err => {
                    alert('Не удалось получить доступ к микрофону: ' + err.message);
                });
        };

        function initMicrophone() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    micPermission = true;
                    localStream = stream;
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    gainNode = audioContext.createGain();
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(gainNode);
                })
                .catch(() => {
                    document.getElementById('micPermission').style.display = 'block';
                });
        }

        // Получение списка пользователей
        const usersRef = collection(db, 'users');
        let usersList = {};

        onSnapshot(usersRef, (snapshot) => {
            usersList = {};
            snapshot.forEach(doc => {
                const data = doc.data();
                if (doc.id !== currentUser) {
                    usersList[doc.id] = { ...data, uid: doc.id };
                }
            });
            renderUsers();
        });

        // Статусы пользователей из Realtime Database
        onValue(ref(rtdb, 'users'), (snapshot) => {
            const data = snapshot.val() || {};
            renderUsers(data);
        });

        function renderUsers(statuses = {}) {
            const container = document.getElementById('usersList');
            
            const onlineUsers = Object.keys(usersList).filter(uid => {
                return statuses[uid]?.status === 'online';
            });

            const offlineUsers = Object.keys(usersList).filter(uid => {
                return statuses[uid]?.status !== 'online';
            });

            if (Object.keys(usersList).length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <h3>👋 Пользователей пока нет</h3>
                        <p>Пригласите друзей!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            
            // Сначала онлайн пользователи
            onlineUsers.forEach(uid => {
                html += createUserCard(uid, true, statuses[uid]);
            });
            
            // Потом оффлайн
            offlineUsers.forEach(uid => {
                html += createUserCard(uid, false, statuses[uid]);
            });

            container.innerHTML = html;
            updateAllCalls();
        }

        function createUserCard(uid, isOnline, statusData) {
            const isCalling = statusData?.calling === currentUser;
            const callStatus = statusData?.callStatus || '';
            
            return `
                <div class="user-card" id="card-${uid}">
                    <div class="username">${uid}</div>
                    <div class="status ${isOnline ? 'online' : 'offline'}">
                        ${isOnline ? '🟢 Онлайн' : '🔴 Офлайн'}
                    </div>
                    ${isOnline ? `
                        <div class="call-controls">
                            <button class="btn btn-call ${isCalling ? 'active' : ''}" 
                                    onclick="toggleCall('${uid}')">
                                ${isCalling ? '🔴 Завершить' : '📞 Позвонить'}
                            </button>
                            <span class="mic-indicator ${micPermission ? 'active' : ''}" 
                                  title="${micPermission ? 'Микрофон активен' : 'Микрофон отключен'}"></span>
                        </div>
                        ${callStatus ? `<div class="call-status">${callStatus}</div>` : ''}
                    ` : ''}
                </div>
            `;
        }

        // Глобальные функции для вызова
        window.toggleCall = function(targetUser) {
            if (!micPermission) {
                alert('Пожалуйста, разрешите доступ к микрофону');
                window.requestMicrophone();
                return;
            }

            const callRef = ref(rtdb, `users/${targetUser}`);
            onValue(callRef, (snapshot) => {
                const data = snapshot.val() || {};
                const currentCallStatus = data.calling === currentUser;
                
                if (currentCallStatus) {
                    // Завершаем звонок
                    remove(ref(rtdb, `users/${targetUser}/calling`));
                    remove(ref(rtdb, `users/${targetUser}/callStatus`));
                    closePeerConnection(targetUser);
                } else {
                    // Начинаем звонок
                    set(callRef, {
                        ...data,
                        calling: currentUser,
                        callStatus: 'Входящий звонок...'
                    });
                    createPeerConnection(targetUser);
                }
            }, { onlyOnce: true });
        };

        // Слушаем входящие звонки
        const myStatusRef = ref(rtdb, `users/${currentUser}`);
        onValue(myStatusRef, (snapshot) => {
            const data = snapshot.val() || {};
            if (data.calling && data.calling !== currentUser) {
                // Принимаем звонок автоматически
                const caller = data.calling;
                if (micPermission) {
                    set(ref(rtdb, `users/${caller}/callStatus`), 'Соединение установлено');
                    createPeerConnection(caller);
                }
            }
        });

        // Создание WebRTC соединения
        function createPeerConnection(targetUser) {
            if (peerConnections[targetUser]) {
                return;
            }

            const pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            });

            peerConnections[targetUser] = pc;

            // Добавляем локальный аудио поток
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            // Получаем удаленный аудио поток
            pc.ontrack = (event) => {
                const audio = new Audio();
                audio.srcObject = event.streams[0];
                audio.play().catch(() => {});
            };

            // ICE кандидаты
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    const candidateRef = ref(rtdb, `users/${targetUser}/candidate`);
                    set(candidateRef, event.candidate.toJSON());
                }
            };

            // Создаем offer
            pc.createOffer()
                .then(offer => pc.setLocalDescription(offer))
                .then(() => {
                    const offerRef = ref(rtdb, `users/${targetUser}/offer`);
                    set(offerRef, pc.localDescription);
                })
                .catch(console.error);

            // Слушаем ответ
            const answerRef = ref(rtdb, `users/${targetUser}/answer`);
            onValue(answerRef, (snapshot) => {
                const answer = snapshot.val();
                if (answer && pc.signalingState !== 'stable') {
                    pc.setRemoteDescription(new RTCSessionDescription(answer))
                        .catch(console.error);
                }
            });

            // Слушаем кандидаты
            const candidateRef = ref(rtdb, `users/${targetUser}/candidate`);
            onValue(candidateRef, (snapshot) => {
                const candidate = snapshot.val();
                if (candidate) {
                    pc.addIceCandidate(new RTCIceCandidate(candidate))
                        .catch(console.error);
                }
            });

            // Слушаем ответ на offer
            const answerOfferRef = ref(rtdb, `users/${currentUser}/answer`);
            onValue(answerOfferRef, (snapshot) => {
                const answer = snapshot.val();
                if (answer && pc.signalingState === 'have-local-offer') {
                    pc.setRemoteDescription(new RTCSessionDescription(answer))
                        .catch(console.error);
                }
            });

            // Очистка при закрытии
            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    closePeerConnection(targetUser);
                    remove(ref(rtdb, `users/${targetUser}/calling`));
                    remove(ref(rtdb, `users/${targetUser}/callStatus`));
                    remove(ref(rtdb, `users/${targetUser}/offer`));
                    remove(ref(rtdb, `users/${targetUser}/answer`));
                    remove(ref(rtdb, `users/${targetUser}/candidate`));
                }
            };
        }

        function closePeerConnection(targetUser) {
            if (peerConnections[targetUser]) {
                peerConnections[targetUser].close();
                delete peerConnections[targetUser];
            }
            // Очищаем Realtime Database
            remove(ref(rtdb, `users/${targetUser}/offer`));
            remove(ref(rtdb, `users/${targetUser}/answer`));
            remove(ref(rtdb, `users/${targetUser}/candidate`));
        }

        function updateAllCalls() {
            // Обновляем состояние всех вызовов
            Object.keys(peerConnections).forEach(uid => {
                const card = document.getElementById(`card-${uid}`);
                if (card) {
                    const btn = card.querySelector('.btn-call');
                    if (btn) {
                        const isCalling = btn.classList.contains('active');
                        btn.textContent = isCalling ? '🔴 Завершить' : '📞 Позвонить';
                    }
                }
            });
        }

        // Выход
        window.logout = function() {
            const statusRef = ref(rtdb, `users/${currentUser}/status`);
            set(statusRef, 'offline').then(() => {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            });
        };

        // Установка статуса онлайн при загрузке
        const statusRef = ref(rtdb, `users/${currentUser}/status`);
        set(statusRef, 'online');
        onDisconnect(statusRef, () => {
            set(statusRef, 'offline');
        });

        // Периодическое обновление статуса
        setInterval(() => {
            set(statusRef, 'online');
        }, 30000);

        // Предзагрузка микрофона при входе
        if (navigator.mediaDevices) {
            initMicrophone();
        }
    </script>
</body>
</html>
