<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Вход в голосовую группу</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 { 
            text-align: center; 
            margin-bottom: 30px;
            color: #333;
            font-size: 28px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }
        input:focus {
            border-color: #667eea;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        button:active {
            transform: scale(0.98);
        }
        .error {
            color: #e74c3c;
            background: #fde8e8;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        .info {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }
        .spinner {
            display: none;
            text-align: center;
            margin: 10px 0;
        }
        .spinner::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🎧 Voice Group</h1>
        <div class="input-group">
            <label>👤 Логин</label>
            <input type="text" id="loginInput" placeholder="Введите логин" autocomplete="username">
        </div>
        <div class="input-group">
            <label>🔑 Пароль</label>
            <input type="password" id="passwordInput" placeholder="Введите пароль" autocomplete="current-password">
        </div>
        <button id="loginBtn">🚀 Войти</button>
        <div class="spinner" id="spinner"></div>
        <div class="error" id="errorMsg">❌ Неверный логин или пароль</div>
        <div class="info">💡 Аккаунты хранятся в accounts.json</div>
    </div>

    <script>
        const loginInput = document.getElementById('loginInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const spinner = document.getElementById('spinner');

        // Вход по Enter
        [loginInput, passwordInput].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });
        });

        loginBtn.addEventListener('click', login);

        async function login() {
            const login = loginInput.value.trim();
            const password = passwordInput.value.trim();

            if (!login || !password) {
                showError('Заполните все поля!');
                return;
            }

            // Показываем спиннер
            loginBtn.disabled = true;
            spinner.style.display = 'block';
            errorMsg.style.display = 'none';

            try {
                // Загружаем accounts.json
                const response = await fetch('accounts.json');
                if (!response.ok) {
                    throw new Error('Не удалось загрузить базу аккаунтов');
                }
                const data = await response.json();
                
                // Ищем пользователя
                const user = data.users.find(u => 
                    u.login.toLowerCase() === login.toLowerCase() && 
                    u.password === password
                );

                if (user) {
                    // Успешный вход - сохраняем в localStorage и переходим
                    localStorage.setItem('currentUser', JSON.stringify({
                        login: user.login,
                        timestamp: Date.now()
                    }));
                    window.location.href = 'index.html';
                } else {
                    showError('❌ Неверный логин или пароль');
                }
            } catch (error) {
                showError('⚠️ Ошибка загрузки: ' + error.message);
                console.error('Login error:', error);
            } finally {
                loginBtn.disabled = false;
                spinner.style.display = 'none';
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        // Автоматический вход, если уже логинились
        (function checkAutoLogin() {
            const userData = localStorage.getItem('currentUser');
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    if (user.timestamp && Date.now() - user.timestamp < 3600000) { // 1 час
                        window.location.href = 'index.html';
                    } else {
                        localStorage.removeItem('currentUser');
                    }
                } catch (e) {
                    localStorage.removeItem('currentUser');
                }
            }
        })();
    </script>
</body>
</html>
