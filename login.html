<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Pulsar — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"/>
<style>
/* ─── Переменные ─────────────────────────────────────────────── */
:root {
  --acc:    #ffffff;
  --acc2:   #ffffff;
  --accd:   rgba(255,255,255,.12);
  --red:    #d06070;
  --amber:  #d4a843;
  --tx:     #f0eeea;
  --tx2:    #a0a0b0;
  --tx3:    #64647a;
  --b:      rgba(255,255,255,.1);
  --s2:     #161620;
  --s3:     #1e1e2a;
  --inp:    #12121c;
  --r:      16px;
  --fd:     'Unbounded', sans-serif;
  --fs:     'Inter', system-ui, sans-serif;
  --ease:   cubic-bezier(.32, 0, .18, 1);
  --tf:     .13s;
}

/* ─── Сброс ──────────────────────────────────────────────────── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
}
body {
  background: #0e0e16;
  color: var(--tx);
  font-family: var(--fs);
  min-height: 100svh;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 52px 24px 32px;
}

/* ─── Обёртка ────────────────────────────────────────────────── */
.wrap {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  animation: fadeUp .28s var(--ease) both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

/* ─── Логотип ────────────────────────────────────────────────── */
.logo {
  display: flex;
  justify-content: center;
  margin-bottom: 36px;
}
.logo img {
  height: 46px;
  width: auto;
  object-fit: contain;
}

/* ─── Заголовок ──────────────────────────────────────────────── */
.hd { text-align: center; margin-bottom: 20px; }
.form-title {
  font-family: var(--fd);
  font-weight: 900;
  font-size: 1.5rem;
  color: var(--tx);
  letter-spacing: -.04em;
  line-height: 1.15;
  margin-bottom: 6px;
}
.form-title em { color: var(--acc); font-style: normal; }
.form-sub { font-size: .88rem; color: var(--tx3); line-height: 1.5; }

/* ─── Вкладки ────────────────────────────────────────────────── */
.tabs {
  display: flex;
  border-bottom: 1.5px solid var(--b);
  margin-bottom: 16px;
}
.tab {
  flex: 1;
  padding: 9px 4px 11px;
  text-align: center;
  border: none;
  background: none;
  cursor: pointer;
  font-family: var(--fs);
  font-size: .8rem;
  font-weight: 600;
  color: var(--tx3);
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1.5px;
  transition: color var(--tf), border-color var(--tf);
}
.tab.active { color: var(--acc); border-bottom-color: var(--acc); font-weight: 700; }
.tab:hover:not(.active) { color: var(--tx2); }

/* ─── Алерт ──────────────────────────────────────────────────── */
.alert {
  display: none;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  margin-bottom: 10px;
  border-radius: 12px;
  font-size: .75rem;
  color: var(--tx2);
  line-height: 1.5;
  border: 1px solid;
}
.alert.show { display: flex; }
.alert.err  { background: rgba(208,96,112,.06); border-color: rgba(208,96,112,.2); }
.alert.ok   { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.15); }
.alert strong {
  display: block;
  font-size: .7rem;
  font-weight: 700;
  margin-bottom: 2px;
}
.alert.err strong { color: var(--red); }
.alert.ok  strong { color: var(--acc); }

/* ─── Поля ───────────────────────────────────────────────────── */
.field { position: relative; margin-bottom: 10px; }
.lbl {
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--tx3);
  display: block;
  margin-bottom: 6px;
  font-weight: 700;
}
.field-err { font-size: .64rem; color: var(--red); margin-top: 5px; display: none; }
.field-err.show { display: block; }

/* ─── Инпут ──────────────────────────────────────────────────── */
.inp {
  width: 100%;
  background: var(--inp);
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  color: var(--tx);
  font-family: var(--fs);
  font-size: .95rem;
  font-weight: 400;
  padding: 17px 18px;
  outline: none;
  transition: border-color var(--tf), box-shadow var(--tf);
}
.inp:focus      { border-color: var(--acc); box-shadow: 0 0 0 3px var(--accd); }
.inp.has-eye    { padding-right: 52px; }
.inp.err        { border-color: rgba(208,96,112,.5); animation: shake .3s ease; }
.inp::placeholder { color: var(--tx3); }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  22%,66% { transform: translateX(-5px); }
  44%,88% { transform: translateX(5px); }
}

/* ─── Email chip (шаг 2 входа) ───────────────────────────────── */
.email-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  padding: 11px 14px;
  margin-bottom: 10px;
  background: var(--s2);
}
.email-chip-ico {
  width: 28px; height: 28px;
  border-radius: 8px;
  flex-shrink: 0;
  background: var(--inp);
  border: 1px solid var(--b);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--tx3);
}
.email-chip-addr {
  flex: 1;
  font-family: var(--fs);
  font-weight: 700;
  font-size: .85rem;
  color: var(--tx);
  letter-spacing: .01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.email-chip-edit {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--tx3);
  font-size: .68rem;
  font-weight: 700;
  font-family: var(--fs);
  padding: 5px 9px;
  border-radius: 8px;
  background: var(--s3);
  display: flex;
  align-items: center;
  gap: 3px;
  transition: opacity var(--tf);
  flex-shrink: 0;
}
.email-chip-edit:hover { opacity: .7; }

/* ─── Кнопка показа пароля ───────────────────────────────────── */
.eye {
  position: absolute;
  right: 0; top: 0;
  width: 52px; height: 100%;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--tx3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--tf);
}
.eye:hover { color: var(--tx2); }

/* ─── Надёжность пароля ──────────────────────────────────────── */
.ps-bars { display: flex; gap: 4px; margin-top: 8px; }
.ps-bar {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--s3);
  transition: background .3s;
}
.ps-lbl { font-size: .62rem; color: var(--tx3); margin-top: 5px; display: none; }

/* ─── Забыли пароль ──────────────────────────────────────────── */
.opt-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.forgot {
  font-size: .73rem;
  color: var(--tx3);
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--fs);
  padding: 0;
  transition: color var(--tf);
  text-decoration: none;
}
.forgot:hover { color: var(--tx); }

/* ─── Условия использования ──────────────────────────────────── */
.terms-check { margin-bottom: 10px; }
.terms-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.terms-checkbox { display: none; }
.terms-box {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  margin-top: 1px;
  border: 1.5px solid var(--b);
  border-radius: 5px;
  background: var(--inp);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color var(--tf), background var(--tf), box-shadow var(--tf);
}
.terms-checkbox:checked + .terms-box {
  background: var(--acc);
  border-color: var(--acc);
  box-shadow: 0 0 0 3px var(--accd);
}
.terms-checkbox:checked + .terms-box::after {
  content: '';
  display: block;
  width: 5px;
  height: 9px;
  border: 2px solid #0e0e16;
  border-top: none;
  border-left: none;
  transform: rotate(45deg) translate(-1px, -1px);
}
.terms-box.err { border-color: rgba(208,96,112,.5); }
.terms-text { font-size: .69rem; color: var(--tx3); line-height: 1.6; }
.terms-text a { color: var(--acc); text-decoration: none; }
.terms-text a:hover { text-decoration: underline; }
.terms-err { font-size: .64rem; color: var(--red); margin-top: 5px; display: none; }
.terms-err.show { display: block; }

/* ─── Кнопка отправки ────────────────────────────────────────── */
.btn-submit {
  width: 100%;
  padding: 18px;
  background: var(--acc);
  border: none;
  border-radius: var(--r);
  color: #0e0e16;
  font-family: var(--fd);
  font-weight: 900;
  font-size: 1rem;
  letter-spacing: .01em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity .15s, transform .15s;
}
.btn-submit:hover:not(:disabled)  { opacity: .88; }
.btn-submit:active:not(:disabled) { transform: scale(.98); }
.btn-submit:disabled               { background: var(--s3); color: var(--tx3); cursor: not-allowed; }
.btn-submit.loading .btn-txt       { opacity: .4; }

.spinner {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(14,14,22,.3);
  border-top-color: #0e0e16;
  animation: spin .7s linear infinite;
  display: none;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn-submit.loading .spinner { display: block; }

/* ─── Переключение форм ──────────────────────────────────────── */
.switch { text-align: center; margin-top: 14px; font-size: .75rem; color: var(--tx3); }
.switch button {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--acc);
  font-size: .75rem;
  font-family: var(--fs);
  font-weight: 700;
  padding: 0;
  transition: opacity var(--tf);
}
.switch button:hover { opacity: .7; }
</style>
</head>
<body>

<div class="wrap" role="main">

  <!-- Логотип -->
  <div class="logo">
    <img src="pulsar.png" alt="Pulsar"/>
  </div>

  <!-- Заголовок -->
  <div class="hd">
    <div class="form-title" id="card-title">Добро <em>пожаловать</em></div>
    <div class="form-sub"   id="card-sub">Войдите в свой аккаунт Pulsar</div>
  </div>

  <!-- Вкладки -->
  <div class="tabs">
    <button class="tab active" id="tab-login" type="button">Вход</button>
    <button class="tab"        id="tab-reg"   type="button">Регистрация</button>
  </div>

  <!-- Алерт -->
  <div class="alert err" id="lock-alert" role="alert">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px">
      <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16v.01" stroke-linecap="round"/>
    </svg>
    <div><strong id="alert-title"></strong><span id="alert-msg"></span></div>
  </div>

  <!-- ═══════════════ ФОРМА ВХОДА ═══════════════ -->
  <div id="form-login">

    <!-- Шаг 1: email -->
    <div id="login-step-1">
      <div class="field">
        <label class="lbl" for="login-email">Почта</label>
        <input type="email" id="login-email" class="inp"
          placeholder="your@email.com"
          autocomplete="email"
          autofocus
          inputmode="email"/>
        <div class="field-err" id="err-login-email"></div>
      </div>
      <button class="btn-submit" id="btn-login-next" type="button">
        <div class="spinner"></div>
        <span class="btn-txt">Продолжить</span>
      </button>
    </div>

    <!-- Шаг 2: пароль -->
    <div id="login-step-2" style="display:none">
      <div class="email-chip">
        <div class="email-chip-ico">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/>
          </svg>
        </div>
        <div class="email-chip-addr" id="email-chip-addr">—</div>
        <button class="email-chip-edit" type="button" id="btn-login-back">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Изменить
        </button>
      </div>

      <div class="field">
        <label class="lbl" for="login-pass">Пароль</label>
        <input type="password" id="login-pass" class="inp has-eye"
          placeholder="Введите пароль"
          autocomplete="current-password"/>
        <button class="eye" id="eye-login" type="button" aria-label="Показать пароль">
          <svg id="eye-login-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="eye-login-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
        <div class="field-err" id="err-login-pass"></div>
      </div>

      <div class="opt-row">
        <button class="forgot" id="btn-forgot" type="button">Забыли пароль?</button>
      </div>

      <button class="btn-submit" id="btn-login" type="button">
        <div class="spinner"></div>
        <span class="btn-txt">Войти</span>
      </button>
    </div>

    <div class="switch">Нет аккаунта? <button type="button" id="go-reg">Создать</button></div>
  </div>

  <!-- ═══════════════ ФОРМА РЕГИСТРАЦИИ ═══════════════ -->
  <div id="form-reg" style="display:none">

    <div class="field">
      <label class="lbl" for="reg-name">Имя и фамилия</label>
      <input type="text" id="reg-name" class="inp"
        placeholder="Иван Иванов"
        autocomplete="name"/>
      <div class="field-err" id="err-reg-name"></div>
    </div>

    <div class="field">
      <label class="lbl" for="reg-email">Почта</label>
      <input type="email" id="reg-email" class="inp"
        placeholder="your@email.com"
        autocomplete="email"
        inputmode="email"/>
      <div class="field-err" id="err-reg-email"></div>
    </div>

    <div class="field">
      <label class="lbl" for="reg-pass">Пароль</label>
      <input type="password" id="reg-pass" class="inp has-eye"
        placeholder="Минимум 8 символов"
        autocomplete="new-password"/>
      <button class="eye" id="eye-reg" type="button" aria-label="Показать пароль">
        <svg id="eye-reg-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="eye-reg-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
      <div class="ps-bars" id="ps-bars">
        <div class="ps-bar"></div>
        <div class="ps-bar"></div>
        <div class="ps-bar"></div>
        <div class="ps-bar"></div>
      </div>
      <div class="ps-lbl" id="ps-lbl"></div>
      <div class="field-err" id="err-reg-pass"></div>
    </div>

    <div class="terms-check">
      <label class="terms-label" for="reg-agree">
        <input type="checkbox" id="reg-agree" class="terms-checkbox"/>
        <span class="terms-box" id="terms-box"></span>
        <span class="terms-text">
          Регистрируясь, вы соглашаетесь с
          <a href="https://galelium.com/privacy.html" target="_blank" rel="noopener">политикой конфиденциальности</a>
          и правилами обработки персональных данных Pulsar.
        </span>
      </label>
      <div class="terms-err" id="err-reg-agree">Необходимо принять условия для регистрации</div>
    </div>

    <button class="btn-submit" id="btn-reg" type="button">
      <div class="spinner"></div>
      <span class="btn-txt">Зарегистрироваться</span>
    </button>

    <div class="switch">Уже есть аккаунт? <button type="button" id="go-login">Войти</button></div>
  </div>

</div><!-- /.wrap -->

<script type="module">
import { auth, db } from './firebase.js';
import {
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  updateProfile,
  setPersistence,
  browserLocalPersistence,
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
import { doc, getDoc, setDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';

const HOME = 'pulsar.html';

// ─── DOM-ссылки ───────────────────────────────────────────────
const alertEl      = document.getElementById('lock-alert');
const alertTitle   = document.getElementById('alert-title');
const alertMsg     = document.getElementById('alert-msg');
const cardTitle    = document.getElementById('card-title');
const cardSub      = document.getElementById('card-sub');

// Вход
const loginEmail   = document.getElementById('login-email');
const loginPass    = document.getElementById('login-pass');
const btnLoginNext = document.getElementById('btn-login-next');
const btnLogin     = document.getElementById('btn-login');
const btnLoginBack = document.getElementById('btn-login-back');
const btnForgot    = document.getElementById('btn-forgot');
const loginStep1   = document.getElementById('login-step-1');
const loginStep2   = document.getElementById('login-step-2');
const emailChipAddr = document.getElementById('email-chip-addr');

// Регистрация
const regName  = document.getElementById('reg-name');
const regEmail = document.getElementById('reg-email');
const regPass  = document.getElementById('reg-pass');
const btnReg   = document.getElementById('btn-reg');

let loginEmailValue = '';

// ─── Auth state ───────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user) {
    setTimeout(() => { window.location.href = HOME; }, 600);
  }
});

// ─── Переключение форм ────────────────────────────────────────
const tabLogin  = document.getElementById('tab-login');
const tabReg    = document.getElementById('tab-reg');
const formLogin = document.getElementById('form-login');
const formReg   = document.getElementById('form-reg');

function switchMode(mode) {
  const isLogin = mode === 'login';
  tabLogin.classList.toggle('active',  isLogin);
  tabReg.classList.toggle('active',   !isLogin);
  formLogin.style.display = isLogin ? '' : 'none';
  formReg.style.display   = isLogin ? 'none' : '';
  cardTitle.innerHTML = isLogin
    ? 'Добро <em>пожаловать</em>'
    : 'Создайте <em>аккаунт</em>';
  cardSub.textContent = isLogin
    ? 'Войдите в свой аккаунт Pulsar'
    : 'Быстрая регистрация';
  hideAlert();
  clearAllErrors();
  goLoginStep(1);
}

tabLogin.addEventListener('click', () => switchMode('login'));
tabReg.addEventListener('click',   () => switchMode('reg'));
document.getElementById('go-reg').addEventListener('click',   () => switchMode('reg'));
document.getElementById('go-login').addEventListener('click', () => switchMode('login'));

// ─── Показ/скрытие пароля ────────────────────────────────────
function bindEye(btnId, inpId, showId, hideId) {
  const btn = document.getElementById(btnId);
  const inp = document.getElementById(inpId);
  btn.addEventListener('click', () => {
    const isPass = inp.type === 'password';
    inp.type = isPass ? 'text' : 'password';
    document.getElementById(showId).style.display = isPass ? 'none' : '';
    document.getElementById(hideId).style.display = isPass ? '' : 'none';
  });
}
bindEye('eye-login', 'login-pass', 'eye-login-show', 'eye-login-hide');
bindEye('eye-reg',   'reg-pass',   'eye-reg-show',   'eye-reg-hide');

// ─── Надёжность пароля ────────────────────────────────────────
const psBars = document.querySelectorAll('#ps-bars .ps-bar');
const psLbl  = document.getElementById('ps-lbl');

regPass.addEventListener('input', () => {
  const v = regPass.value;
  if (!v) {
    psBars.forEach(b => b.style.background = 'var(--s3)');
    psLbl.style.display = 'none';
    return;
  }
  let score = 0;
  if (v.length >= 8)  score++;
  if (v.length >= 12) score++;
  if (/[A-Z]/.test(v) || /[а-яА-Я]/.test(v)) score++;
  if (/\d/.test(v) && /[^a-zA-Zа-яА-Я0-9]/.test(v)) score++;

  const colors = ['var(--red)', 'var(--amber)', 'rgba(255,255,255,.6)', 'var(--acc)'];
  const labels = ['Слабый', 'Средний', 'Хороший', 'Надёжный'];
  const idx    = Math.min(score, 4) - 1;
  psBars.forEach((b, i) => { b.style.background = i < score ? colors[idx] : 'var(--s3)'; });
  psLbl.style.display = 'block';
  psLbl.textContent   = labels[idx] || '';
  psLbl.style.color   = colors[idx] || 'var(--tx3)';
});

// ─── Алерты и ошибки ──────────────────────────────────────────
function showAlert(title, msg, type = 'err') {
  alertTitle.textContent = title;
  alertMsg.textContent   = ' ' + msg;
  alertEl.className      = `alert ${type} show`;
}
function showSuccess(title, msg) { showAlert(title, msg, 'ok'); }
function hideAlert() { alertEl.className = 'alert err'; }

function showFieldErr(id, msg) {
  document.getElementById(id)?.classList.add('err');
  const err = document.getElementById('err-' + id);
  if (err) { err.textContent = msg; err.classList.add('show'); }
}
function clearFieldErr(id) {
  document.getElementById(id)?.classList.remove('err');
  const err = document.getElementById('err-' + id);
  if (err) { err.textContent = ''; err.classList.remove('show'); }
}
function clearAllErrors() {
  ['login-email', 'login-pass', 'reg-name', 'reg-email', 'reg-pass'].forEach(clearFieldErr);
  hideAlert();
}

[loginEmail, loginPass, regName, regEmail, regPass].forEach(inp => {
  inp.addEventListener('input', () => { clearFieldErr(inp.id); hideAlert(); });
});

// ─── Навигация по шагам входа ─────────────────────────────────
function goLoginStep(n) {
  loginStep1.style.display = n === 1 ? '' : 'none';
  loginStep2.style.display = n === 2 ? '' : 'none';
  if (n === 2) setTimeout(() => loginPass.focus(), 150);
  if (n === 1) setTimeout(() => loginEmail.focus(), 150);
}

btnLoginNext.addEventListener('click', () => {
  const email = loginEmail.value.trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showFieldErr('login-email', email ? 'Некорректный формат почты' : 'Введите почту');
    return;
  }
  loginEmailValue          = email;
  emailChipAddr.textContent = email;
  goLoginStep(2);
});

btnLoginBack.addEventListener('click', () => {
  loginPass.value = '';
  hideAlert();
  goLoginStep(1);
});

loginEmail.addEventListener('keydown', e => { if (e.key === 'Enter') btnLoginNext.click(); });
loginPass.addEventListener('keydown',  e => { if (e.key === 'Enter') btnLogin.click(); });

// ─── Firebase ошибки ──────────────────────────────────────────
function fbErr(code) {
  const map = {
    'auth/user-not-found':            ['Пользователь не найден',  'Аккаунта с такой почтой не существует.'],
    'auth/wrong-password':            ['Неверный пароль',          'Введите правильный пароль или сбросьте его.'],
    'auth/invalid-credential':        ['Неверные данные',          'Почта или пароль введены неправильно.'],
    'auth/invalid-login-credentials': ['Неверные данные',          'Почта или пароль введены неправильно.'],
    'auth/invalid-email':             ['Некорректная почта',        'Введите правильный адрес электронной почты.'],
    'auth/email-already-in-use':      ['Почта уже используется',   'Этот адрес уже зарегистрирован. Войдите или сбросьте пароль.'],
    'auth/weak-password':             ['Слабый пароль',             'Пароль должен быть не менее 8 символов.'],
    'auth/too-many-requests':         ['Слишком много попыток',     'Аккаунт временно заблокирован. Попробуйте позже.'],
    'auth/user-disabled':             ['Аккаунт отключён',          'Этот аккаунт деактивирован.'],
    'auth/network-request-failed':    ['Ошибка сети',               'Проверьте подключение к интернету.'],
  };
  return map[code] || ['Ошибка', 'Что-то пошло не так. Попробуйте ещё раз.'];
}

function setLoading(btn, on) {
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

// ─── Профиль в Firestore ──────────────────────────────────────
async function ensureUserProfile(user, extra = {}) {
  const ref  = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, {
      uid:             user.uid,
      email:           user.email || '',
      displayName:     extra.displayName || user.displayName || '',
      phone:           '',
      role:            'user',
      status:          'active',
      provider:        extra.provider || 'email',
      createdAt:       serverTimestamp(),
      updatedAt:       serverTimestamp(),
      lastLoginAt:     serverTimestamp(),
      verifiedByAdmin: false,
      notes:           '',
    });
  } else {
    await setDoc(ref, {
      lastLoginAt: serverTimestamp(),
      updatedAt:   serverTimestamp(),
    }, { merge: true });
  }
}

// ─── Вход ─────────────────────────────────────────────────────
async function doLogin() {
  clearAllErrors();
  const pass = loginPass.value;
  if (!pass) { showFieldErr('login-pass', 'Введите пароль'); return; }
  if (!loginEmailValue) { goLoginStep(1); return; }

  setLoading(btnLogin, true);
  try {
    await setPersistence(auth, browserLocalPersistence);
    const cred = await signInWithEmailAndPassword(auth, loginEmailValue, pass);
    await ensureUserProfile(cred.user, { provider: 'email' });
  } catch (e) {
    const [t, m] = fbErr(e.code);
    showAlert(t, m);
    loginPass.value = '';
    loginPass.focus();
    setLoading(btnLogin, false);
  }
}

btnLogin.addEventListener('click', doLogin);

// ─── Сброс пароля ─────────────────────────────────────────────
btnForgot.addEventListener('click', async () => {
  if (!loginEmailValue) { goLoginStep(1); return; }
  try {
    await sendPasswordResetEmail(auth, loginEmailValue);
    showSuccess('Письмо отправлено', `Проверьте почту ${loginEmailValue} — там ссылка для сброса пароля.`);
  } catch (e) {
    const [t, m] = fbErr(e.code);
    showAlert(t, m);
  }
});

// ─── Регистрация ──────────────────────────────────────────────
const regAgree = document.getElementById('reg-agree');
const termsBox = document.getElementById('terms-box');
const errAgree = document.getElementById('err-reg-agree');

regAgree.addEventListener('change', () => {
  if (regAgree.checked) {
    termsBox.classList.remove('err');
    errAgree.classList.remove('show');
  }
});

async function doRegister() {
  clearAllErrors();
  const name  = regName.value.trim();
  const email = regEmail.value.trim();
  const pass  = regPass.value;
  let bad = false;

  if (name.split(' ').filter(w => w.length >= 2).length < 2) {
    showFieldErr('reg-name', 'Введите имя и фамилию через пробел'); bad = true;
  }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showFieldErr('reg-email', email ? 'Некорректный формат почты' : 'Введите почту');
    bad = true;
  }
  if (!pass || pass.length < 8) { showFieldErr('reg-pass', 'Минимум 8 символов'); bad = true; }
  if (!regAgree.checked) {
    termsBox.classList.add('err');
    errAgree.classList.add('show');
    bad = true;
  }
  if (bad) return;

  setLoading(btnReg, true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await ensureUserProfile(cred.user, { displayName: name, provider: 'email' });
  } catch (e) {
    const [t, m] = fbErr(e.code);
    showAlert(t, m);
    setLoading(btnReg, false);
  }
}

btnReg.addEventListener('click', doRegister);
[regName, regEmail].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') regPass.focus(); });
});
regPass.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
