<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .tab {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .tab button {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-size: 16px;
            cursor: pointer;
            color: #666;
            transition: all 0.3s;
        }
        .tab button.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button[type="submit"]:hover {
            background: #5a67d8;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        .success {
            color: green;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎤 Pulsar Galelium</h2>
        <div class="tab">
            <button class="active" onclick="switchTab('login')">Вход</button>
            <button onclick="switchTab('register')">Регистрация</button>
        </div>

        <div id="loginForm" class="form active">
            <form id="login">
                <input type="text" id="loginUsername" placeholder="Имя пользователя" required>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
                <button type="submit">Войти</button>
                <div id="loginMessage"></div>
            </form>
        </div>

        <div id="registerForm" class="form">
            <form id="register">
                <input type="text" id="regUsername" placeholder="Имя пользователя" required>
                <input type="password" id="regPassword" placeholder="Пароль" required>
                <input type="password" id="regConfirm" placeholder="Подтвердите пароль" required>
                <button type="submit">Зарегистрироваться</button>
                <div id="registerMessage"></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { getDatabase, ref, set, onDisconnect } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCtMunMRiOWKSGh939BEU2TvhEgv_wB60",
            authDomain: "pulsar-galelium.firebaseapp.com",
            databaseURL: "https://pulsar-galelium-default-rtdb.firebaseio.com",
            projectId: "pulsar-galelium",
            storageBucket: "pulsar-galelium.firebasestorage.app",
            messagingSenderId: "407132877855",
            appId: "1:407132877855:web:fd29af874d74dcda90912a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        window.switchTab = function(tab) {
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.tab button').forEach(b => b.classList.remove('active'));
            
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.querySelector('.tab button:first-child').classList.add('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
                document.querySelector('.tab button:last-child').classList.add('active');
            }
        };

        // Регистрация
        document.getElementById('register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const msg = document.getElementById('registerMessage');

            if (!username || !password) {
                msg.textContent = 'Заполните все поля';
                msg.className = 'error';
                return;
            }

            if (password !== confirm) {
                msg.textContent = 'Пароли не совпадают';
                msg.className = 'error';
                return;
            }

            try {
                const userRef = doc(db, 'users', username);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    msg.textContent = 'Пользователь уже существует';
                    msg.className = 'error';
                    return;
                }

                await setDoc(userRef, {
                    password: password,
                    createdAt: new Date().toISOString(),
                    isOnline: false
                });

                msg.textContent = 'Регистрация успешна! Войдите в систему.';
                msg.className = 'success';
                
                document.getElementById('regUsername').value = '';
                document.getElementById('regPassword').value = '';
                document.getElementById('regConfirm').value = '';
                
                setTimeout(() => window.switchTab('login'), 1500);
            } catch (error) {
                msg.textContent = 'Ошибка: ' + error.message;
                msg.className = 'error';
            }
        });

        // Вход
        document.getElementById('login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const msg = document.getElementById('loginMessage');

            if (!username || !password) {
                msg.textContent = 'Заполните все поля';
                msg.className = 'error';
                return;
            }

            try {
                const userRef = doc(db, 'users', username);
                const userSnap = await getDoc(userRef);
                
                if (!userSnap.exists()) {
                    msg.textContent = 'Пользователь не найден';
                    msg.className = 'error';
                    return;
                }

                const userData = userSnap.data();
                if (userData.password !== password) {
                    msg.textContent = 'Неверный пароль';
                    msg.className = 'error';
                    return;
                }

                // Сохраняем сессию
                sessionStorage.setItem('currentUser', username);
                
                // Устанавливаем статус онлайн
                const statusRef = ref(rtdb, `users/${username}/status`);
                await set(statusRef, 'online');
                await onDisconnect(statusRef, () => {
                    set(statusRef, 'offline');
                });

                window.location.href = 'index.html';
            } catch (error) {
                msg.textContent = 'Ошибка: ' + error.message;
                msg.className = 'error';
            }
        });
    </script>
</body>
</html>
